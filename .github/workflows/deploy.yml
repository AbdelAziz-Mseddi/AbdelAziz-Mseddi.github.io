name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refreshes the live GitHub stats baked into the static build.
    # GitHub's cron scheduler is best-effort, not exact-to-the-minute.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # PAT (scopes: read:user, repo), SAML-authorized for the private org,
          # so the contribution calendar includes private contributions. Without
          # it the build falls back to the public-only count. Set via:
          #   gh secret set GH_STATS_TOKEN
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
